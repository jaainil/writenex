name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: writenex-release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          registry-url: "https://registry.npmjs.org"

      # npm trusted publishing requires npm >= 11.5.1.
      - name: Set up npm for trusted publishing
        run: npm install --global npm@11.19.1

      - run: pnpm install --frozen-lockfile

      - name: Verify packages
        run: |
          pnpm test
          pnpm --filter @imjp/writenex-astro type-check
          pnpm --filter @imjp/writenex-next type-check

      - name: Build both integrations
        run: |
          pnpm build:astro
          pnpm build:next

      - name: Create shared release and publish both packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
